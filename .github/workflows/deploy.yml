name: Deploy Multiple Slidev Presentations

on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Get changed files
        id: changed-files
        run: |
          BASE_SHA="${{ github.event.before }}"
          CURRENT_SHA="${{ github.sha }}"

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$CURRENT_SHA")
          CHANGED_MARKDOWN=$(echo "$CHANGED_FILES" | grep '\.md$' | grep -v 'README\|CONTRIBUTING\|LICENSE\|CHANGELOG' || true)
          DEPLOY_SUPPORT_FILES=$(echo "$CHANGED_FILES" | grep -E '^(\.github/workflows/deploy\.yml|scripts/generate-index\.mjs|package\.json|pnpm-lock\.yaml)$' || true)

          SHOULD_DEPLOY=false
          if [ -n "$CHANGED_MARKDOWN" ] || [ -n "$DEPLOY_SUPPORT_FILES" ]; then
            SHOULD_DEPLOY=true
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo "Changed markdown files:"
          echo "$CHANGED_MARKDOWN"
          echo "Deployment support changes:"
          echo "$DEPLOY_SUPPORT_FILES"
          echo "should_deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT
          echo "files=$(echo "$CHANGED_MARKDOWN" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> $GITHUB_OUTPUT

      - name: Checkout gh-pages branch
        if: success() && steps.changed-files.outputs.should_deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: prev-dist
          fetch-depth: 1

      - name: Prepare dist
        if: steps.changed-files.outputs.should_deploy == 'true'
        run: |
          mkdir -p dist
          if [ -d "prev-dist" ]; then
            cp -r prev-dist/* dist/ 2>/dev/null || true
            echo "Previous build results copied"
          fi

      - name: Build changed presentations
        if: steps.changed-files.outputs.files != '[]'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          FILES=$(echo '${{ steps.changed-files.outputs.files }}' | jq -r '.[]')
          for file in $FILES; do
            if [[ "$file" != *.md || "$file" == */* ]]; then
              echo "Skipping non-root markdown file: $file"
              continue
            fi
            
            name=$(basename "$file" .md)
            echo "Building $name from $file"
            pnpm slidev build "$file" --base "/$name/" --out "dist/$name"
            pnpm slidev export "$file" --output "dist/$name"
          done

      - name: Update index page
        if: success() && steps.changed-files.outputs.should_deploy == 'true'
        run: |
          node scripts/generate-index.mjs dist

      - name: Deploy
        if: success() && steps.changed-files.outputs.should_deploy == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: false # 不删除旧内容
